version: 2
updates:
  - package-ecosystem: dotnet-sdk
    directory: "/"
    schedule:
      interval: daily

  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: daily
    groups:
      dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    # gh-aw lock files pin these actions; they are updated by recompiling with tools/gh-aw.
    ignore:
      - dependency-name: "github/gh-aw-actions/*"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: "/tools/ghalint"
    schedule:
      interval: daily

  - package-ecosystem: gomod
    directory: "/tools/gh-aw"
    schedule:
      interval: daily
